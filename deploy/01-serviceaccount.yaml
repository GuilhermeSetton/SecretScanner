apiVersion: v1
kind: ServiceAccount
metadata:
  name: secretscanner-webhook
  namespace: secretscanner-system
  labels:
    app.kubernetes.io/name: secretscanner-webhook
    app.kubernetes.io/component: admission-controller
    app.kubernetes.io/part-of: secretscanner-k8s
---
# The admission webhook operates strictly on submitted admission payloads in memory.
# It does not query or list cluster secrets, requiring minimal RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secretscanner-webhook-role
  namespace: secretscanner-system
  labels:
    app.kubernetes.io/name: secretscanner-webhook
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secretscanner-webhook-rolebinding
  namespace: secretscanner-system
  labels:
    app.kubernetes.io/name: secretscanner-webhook
subjects:
  - kind: ServiceAccount
    name: secretscanner-webhook
    namespace: secretscanner-system
roleRef:
  kind: Role
  name: secretscanner-webhook-role
  apiGroup: rbac.authorization.k8s.io
