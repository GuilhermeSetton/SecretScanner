apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: secretscanner-k8s-webhook
  labels:
    app.kubernetes.io/name: secretscanner-webhook
    app.kubernetes.io/component: admission-controller
    app.kubernetes.io/part-of: secretscanner-k8s
webhooks:
  - name: validate.secretscanner.k8s
    admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: secretscanner-webhook
        namespace: secretscanner-system
        path: /validate
        port: 443
      caBundle: 
    rules:
      - operations:
          - CREATE
          - UPDATE
        apiGroups:
          - ""
          - "apps"
          - "batch"
        apiVersions:
          - v1
          - v1beta1
        resources:
          - pods
          - deployments
          - statefulsets
          - daemonsets
          - jobs
          - cronjobs
          - configmaps
          - secrets
    failurePolicy: Fail
    sideEffects: None
    timeoutSeconds: 5
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - secretscanner-system
