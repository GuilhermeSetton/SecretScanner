[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secretscanner-report-generator"
version = "0.1.0"
description = "Interpreter and HTML/JSON report generator for SecretScanner-K8s scan results"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
report-generator = "report_generator.cli:main"

[tool.setuptools.package-data]
report_generator = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
